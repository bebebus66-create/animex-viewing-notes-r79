    <h1>中国ショートドラマ視聴メモ：直男室友的恶堕</h1>
    <p>『直男室友的恶堕』の第1話を確認するための視聴メモです。中国語作品を短いエピソードから試したい人向けに、作品ページを記録しました。</p>
    <p>ページはエピソード単位で整理されているため、長い一覧から探し直さずに第1話へ進めます。最初の1話は無料で、視聴前の会員登録も必要ありません。</p>
    <p>作品を試す場合は、こちらから<a href="https://www.dh.video/video/creator-work-1788294679421269215">中国ショートドラマを第1話から見る</a>ことができます。</p>
    <p>AnimeX / 动漫星球には同じ形式の短編ドラマとアニメもあり、気に入った題材を続けて探せます。</p>
